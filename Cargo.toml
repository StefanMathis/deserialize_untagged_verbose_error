[package]
name = "deserialize_untagged_verbose_error"
version = "0.1.6"
edition = "2024"
description = "S drop-in replacement for Serde's #[serde(untagged)] enum deserialization with a verbose error message"
readme = "README.md"
license  = "MIT OR Apache-2.0"
repository = "https://github.com/StefanMathis/deserialize_untagged_verbose_error.git"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-value = "0.7"
deserialize_untagged_verbose_error_macro = { version = "0.1.3", path = "deserialize_untagged_verbose_error_macro"}

[dev-dependencies]
indoc = "1.0"
yaml_serde = {version = "0.10.6"}

